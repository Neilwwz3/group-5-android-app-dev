name: Android CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: ./gradlew build

  emulator-smoke-test:
    name: Launch MovieTracker in Android emulator
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'test/emulator-launch-')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Install and launch MovieTracker
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 35
        target: google_apis
        arch: x86_64
        profile: pixel_6
        disable-animations: true
        emulator-boot-timeout: 900
        script: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          adb shell am start -W -n hk.hkucs.group_6_android_app_dev/.MainActivity | tee emulator-launch.txt
          sleep 12
          adb shell pidof hk.hkucs.group_6_android_app_dev | tee emulator-pid.txt
          adb shell dumpsys activity activities | grep -E 'topResumedActivity|mResumedActivity|ResumedActivity' | tee emulator-foreground.txt
          grep -q 'hk.hkucs.group_6_android_app_dev' emulator-foreground.txt
          adb exec-out screencap -p > movie-tracker-home.png
          adb shell uiautomator dump /sdcard/window.xml || true
          adb shell cat /sdcard/window.xml > movie-tracker-ui.xml || true
          adb logcat -d -b crash > emulator-crashes.txt || true
          echo 'EMULATOR_LAUNCH_VERIFIED'
    - name: Upload emulator launch evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: movietracker-emulator-evidence
        if-no-files-found: warn
        path: |
          emulator-launch.txt
          emulator-pid.txt
          emulator-foreground.txt
          emulator-crashes.txt
          movie-tracker-home.png
          movie-tracker-ui.xml
